name: CI

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check Python syntax
        run: python -m py_compile infer.py minimax_h3_mlu/*.py tools/*.py
      - name: Check shell syntax
        run: bash -n download.sh download_turbo.sh interactive.sh run.sh setup.sh
